name: reducer

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run Id'
        required: true
        default: '21585516465'
        type: string
      run_number:
        description: 'Run Number'
        required: true
        default: '989'
        type: string

env:
  python3_version: '3.x'

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-24.04

    env:
      artifact-name: uhdm-reduce_ubuntu-gcc_release

    steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        architecture: 'x64'

    - name: Install Core Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt install -y g++-11
        sudo apt install -y build-essential
        sudo apt install -y cmake
        sudo apt install -y ninja-build

        python -m pip install orderedmultidict

    - name: Git pull
      uses: actions/checkout@v4
      with:
        sparse-checkout: CMakeLists.txt
        sparse-checkout-cone-mode: false

    - name: Update UHDM submodule
      shell: bash
      run: git submodule update --init --recursive -- third_party/UHDM

    - name: Build UHDM submodule
      shell: bash
      env:
        CC: gcc-11
        CXX: g++-11
      run: |
        env
        which cmake && cmake --version
        which ninja && ninja --version
        which $CC && $CC --version
        which $CXX && $CXX --version
        which python && python --version

        cd third_party/UHDM
        cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -S . -B build
        cmake --build build -j `nproc` --target uhdm-reduce

    - name: Build compressed artifacts
      if: always()
      shell: bash
      run: |
        cd third_party/UHDM/build/bin
        tar czfp ${{ env.artifact-name }}.tar.gz uhdm-reduce

    - name: Archive artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.artifact-name }}
        path: third_party/UHDM/build/bin/${{ env.artifact-name }}.tar.gz


  reduction:
    name: "Reducer | ${{ matrix.config.artifact-tag }} | ${{ matrix.shard }}"
    runs-on: ${{ matrix.config.os }}
    needs: build

    env:
      uhdm-reduce-build-artifact-name: uhdm-reduce_ubuntu-gcc_release
      surelog-build-artifact-name: Surelog_${{ matrix.config.artifact-tag }}_${{ matrix.config.build-type }}_${{ github.event.inputs.run_number }}
      regression-artifact-name: Surelog_regression_${{ matrix.config.artifact-tag }}_${{ matrix.config.build-type }}_${{ github.event.inputs.run_number }}_${{ matrix.shard }}
      reducer-artifact-name: Reducer_${{ matrix.config.artifact-tag }}_${{ matrix.config.build-type }}_${{ github.run_number }}_${{ matrix.shard }}

    strategy:
      fail-fast: false
      matrix:
        num_shards: [6]
        shard: [0, 1, 2, 3, 4, 5]
        config:
        - { os: ubuntu-24.04, artifact-tag: ubuntu-gcc, build-type: release }
#        - { os: windows-2022, artifact-tag: windows-cl, build-type: release }

    steps:
    - name: Git Pull
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          scripts
          tests
          third_party/tests
        lfs: true

    - name: Download uhdm-reduce build artifact
      uses: actions/download-artifact@v6
      with:
        name: ${{ env.uhdm-reduce-build-artifact-name }}

    - name: Download regression artifact
      uses: actions/download-artifact@v6
      with:
        name: ${{ env.regression-artifact-name }}
        run-id: ${{ github.event.inputs.run_id }}
        github-token: ${{ secrets.GHA_DAVENCHE_CI_TOKEN }}

    - name: Extract artifacts
      shell: bash
      run: |
        mkdir -p build

        mv ${{ env.uhdm-reduce-build-artifact-name }}.tar.gz build/.
        pushd build
          tar xzfp ${{ env.uhdm-reduce-build-artifact-name }}.tar.gz
        popd

        tar xzfp ${{ env.regression-artifact-name }}.tar.gz
        rm ${{ env.regression-artifact-name }}.tar.gz
        mv ${{ env.regression-artifact-name }} regression

        pushd regression
          for archive in *; do
            if [[ "$archive" != "*.tar.gz" ]]; then
              tar xzfp $archive
              rm $archive
            fi
          done
        popd

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.python3_version }}
        architecture: 'x64'

    - name: Setup Python Packages
      run: pip3 install pathlibutil psutil tabulate

    - name: Run reduction
      timeout-minutes: 30
      run: |
        python3 scripts/reducer.py        \
          --build-dirpath build           \
          --reducer-filepath uhdm-reduce  \
          --source-dirpath regression     \
          --jobs $(nproc)                 \
          --verbose

    - name: Prepare regression artifacts
      if: always()
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: |
        echo "$GITHUB_CONTEXT" > env.txt
        mv regression ${{ env.reducer-artifact-name }}
        tar czfp ${{ env.reducer-artifact-name }}.tar.gz ${{ env.reducer-artifact-name }}

    - name: Archive artifacts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.reducer-artifact-name }}
        path: |
          ${{ env.reducer-artifact-name }}.tar.gz
          env.txt
